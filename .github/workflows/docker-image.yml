name: Docker image

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/waninter/canvas

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

  build:
    needs: meta
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.arch }}

      - name: Export digest
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs:
      - meta
      - build
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.inspect.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Create multi-arch manifest
        shell: bash
        env:
          TAGS: ${{ needs.meta.outputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              tag_args+=("-t" "$tag")
            fi
          done <<< "$TAGS"

          digest_args=()
          while IFS= read -r digest_file; do
            digest_args+=("${IMAGE_NAME}@sha256:${digest_file}")
          done < <(find "$RUNNER_TEMP/digests" -type f -printf '%f\n' | sort)

          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"

      - id: inspect
        name: Report image digest
        shell: bash
        run: |
          image_tag="${IMAGE_NAME}:sha-${GITHUB_SHA::7}"
          image_digest=""
          for attempt in 1 2 3 4 5; do
            if inspect_output="$(docker buildx imagetools inspect "$image_tag" 2>/dev/null)"; then
              image_digest="$(awk '$1 == "Digest:" {print $2; exit}' <<< "$inspect_output")"
              [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]] && break
            fi
            sleep $((attempt * 2))
          done
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "### Published image"
            echo
            echo '\`'"${IMAGE_NAME}@${image_digest}"'\`'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "digest=$image_digest" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to production
    needs: merge
    if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.PRODUCTION_SSH_KEY_PASSPHRASE }}
        run: |
          set -eu
          ssh_dir="$RUNNER_TEMP/canvas-ssh"
          mkdir -p "$ssh_dir"
          key_file="$ssh_dir/deploy_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keygen -p -P "$SSH_PASSPHRASE" -N '' -f "$key_file" >/dev/null
          eval "$(ssh-agent -s)"
          ssh-add "$key_file"
          printf 'SSH_AUTH_SOCK=%s\n' "$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          printf 'SSH_AGENT_PID=%s\n' "$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Prepare known hosts
        env:
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          test -n "$KNOWN_HOSTS"
          mkdir -p "$RUNNER_TEMP/canvas-ssh"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/canvas-ssh/known_hosts"

      - name: Deploy and verify
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ needs.merge.outputs.digest }}
          DEPLOY_PATH: /srv/canvas
          HEALTH_URL: http://127.0.0.1:3001/api/health
          KNOWN_HOSTS_FILE: ${{ runner.temp }}/canvas-ssh/known_hosts
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS_FILE")
          image_arg=$(printf '%q' "$IMAGE_REF")
          path_arg=$(printf '%q' "$DEPLOY_PATH")
          health_arg=$(printf '%q' "$HEALTH_URL")
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- $image_arg $path_arg $health_arg false" < "$GITHUB_WORKSPACE/deploy/deploy.sh"
