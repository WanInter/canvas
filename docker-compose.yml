services:
  app:
    image: ${IMAGE_REF:-ghcr.io/waninter/canvas:latest}
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: always
    container_name: ${CONTAINER_NAME:-canvas}
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    restart: unless-stopped
