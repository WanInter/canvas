services:
  app:
    image: ${IMAGE_REF:-ghcr.io/waninter/canvas:latest}
    pull_policy: always
    container_name: ${CONTAINER_NAME:-canvas}
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3001}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: postgresql-canvas
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 512m
    cpus: 1.0

volumes:
  postgres_data:
    name: postgresql-canvas-data

networks:
  default:
    name: canvas-network
